name: Automation System Monitor
on:
  #schedule:
  #  - cron: '0 0 * * 0'  # Weekly on Sunday at midnight
  workflow_dispatch:  # Allow manual triggering

jobs:
  monitor-system:
    runs-on: ubuntu-latest
    steps:
      - name: Check automation users status
        run: |
          echo "Checking automation system health..."
          
          # Check if automation users exist and are active
          curl -X POST \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -d '{"query": "SELECT COUNT(*) as active_users FROM automation_users WHERE is_active = true"}' \
            https://mxigbftmmkqnhmocyeeo.supabase.co/rest/v1/rpc/execute_query || echo "Query failed"
        continue-on-error: true
      
      - name: Log monitoring execution
        run: echo "System monitoring completed at $(date)"
