name: Programmatic Users Cleanup Bot
on:
  #schedule:
  #  - cron: '0 2 * * *'  # Daily at 2 AM UTC
  workflow_dispatch:  # Allow manual triggering

jobs:
  trigger-cleanup-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger automation cleanup bot
        run: |
          curl -X POST \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            https://mxigbftmmkqnhmocyeeo.supabase.co/functions/v1/automation-cleanup
        continue-on-error: true
      
      - name: Log cleanup bot execution
        run: echo "Cleanup bot triggered at $(date)"
